name: Build Paper 26 fix

on:
  push:
    branches:
      - fix/paper-26-version-detection
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Cannons
        run: mvn -B clean package -pl cannons-bukkit -am -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cannons-paper26-fixed
          path: cannons-bukkit/target/cannons-bukkit-3.4.3.jar
          if-no-files-found: error
